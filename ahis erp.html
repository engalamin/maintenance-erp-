<title>AHIS Maintenance ERP</title>

<style>
/* Layout: dark module rail on the left, light working surface on the right. Ledger-style tables, status pills carry meaning. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --surface2:#f6f8f9; --ink:#14232b; --ink2:#52646f; --line:#d6dee3;
  --accent:#0b5f7d; --accent-ink:#ffffff; --accent-soft:#dff0f6;
  --good:#17703f; --good-soft:#dff3e7; --warn:#8f5b00; --warn-soft:#fcefcf; --bad:#b3261e; --bad-soft:#fbe3e0; --info:#2a5db0; --info-soft:#e3ecfb;
  --rail:#0f2a35; --rail-ink:#cfe0e8; --rail-dim:#7f9aa7; --rail-hi:#1b4352;
  --bar:#2f89a8;
  --f-body:'IBM Plex Sans','Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d171c; --surface:#15232a; --surface2:#1a2b33; --ink:#e3edf1; --ink2:#95a9b3;   --line:#2a3c46; --accent:#58bad9; --accent-ink:#06222c; --accent-soft:#17343f;
  --good:#5cc88e; --good-soft:#143525; --warn:#e5b04f; --warn-soft:#3a2e12; --bad:#f28e86; --bad-soft:#3f1d1b; --info:#8fb4f2; --info-soft:#1b2c4a;
  --rail:#091116; --rail-ink:#bccdd5; --rail-dim:#6f8896; --rail-hi:#153240; --bar:#58bad9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d171c; --surface:#15232a; --surface2:#1a2b33; --ink:#e3edf1; --ink2:#95a9b3; --line:#2a3c46;
  --accent:#58bad9; --accent-ink:#06222c; --accent-soft:#17343f;
  --good:#5cc88e; --good-soft:#143525; --warn:#e5b04f; --warn-soft:#3a2e12; --bad:#f28e86; --bad-soft:#3f1d1b; --info:#8fb4f2; --info-soft:#1b2c4a;
  --rail:#091116; --rail-ink:#bccdd5; --rail-dim:#6f8896; --rail-hi:#153240; --bar:#58bad9; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:22px;letter-spacing:-.01em} h2{font-size:15px} h3{font-size:13px}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--ink2)} .small{font-size:12px} .nowrap{white-space:nowrap}
button,input,select,textarea{font:inherit;color:inherit}

.app{display:grid;grid-template-columns:224px minmax(0,1fr);gap:18px;max-width:1500px;margin:0 auto;align-items:start}
.rail{background:var(--rail);color:var(--rail-ink);border-radius:8px;padding:16px 10px;position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.brand{padding:2px 8px 12px;border-bottom:1px solid var(--rail-hi)}
.logoplate{background:#fff;border-radius:6px;padding:6px 8px;margin-bottom:10px}.logoplate img{display:block;width:100%;height:auto}
.brand b{display:block;font-size:15px;letter-spacing:.02em;color:#fff}
.brand span{font-size:11px;color:var(--rail-dim);letter-spacing:.14em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--rail-ink);text-decoration:none;font-weight:500;cursor:pointer}
.nav a:hover{background:var(--rail-hi)}
.nav a.on{background:var(--rail-hi);color:#fff;box-shadow:inset 3px 0 0 var(--bar)}
.nav svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .sep{height:1px;background:var(--rail-hi);margin:6px 8px}
.rail-foot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--rail-hi);font-size:11.5px;color:var(--rail-dim)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:6px}
.dot.ok{background:var(--good)}

.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.page-head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.page-head p{margin:4px 0 0;color:var(--ink2)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:6px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card>h2{margin-bottom:10px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi small{display:block;color:var(--ink2);font-size:12px}
.kpi b{display:block;font-size:20px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi i{font-style:normal;font-size:12px;color:var(--ink2)}
.kpi.bad b{color:var(--bad)} .kpi.good b{color:var(--good)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:100%}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{position:sticky;top:0;background:var(--surface2);text-align:left;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover td{background:var(--accent-soft)}
table.t tfoot td{font-weight:600;background:var(--surface2);border-top:1px solid var(--line)}
table.t th.num{text-align:right}
td.wide{min-width:240px;max-width:380px}
td.mid{min-width:150px}

.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.tag{font-family:var(--f-mono);font-size:12px;color:var(--accent);text-decoration:none;white-space:nowrap}
a.tag:hover{text-decoration:underline}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.filters .f{display:flex;flex-direction:column;gap:3px;min-width:0}
.filters label,.lbl{font-size:11.5px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical}
input[readonly]{background:var(--surface2)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.frm{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.frm .span2{grid-column:span 2} .frm .all{grid-column:1/-1}
@media (max-width:640px){.frm .span2{grid-column:1/-1}}
.hint{font-size:12px;color:var(--ink2)}
.err{color:var(--bad);font-size:12.5px}

.items td{padding:5px 6px}
.items input,.items select,.items textarea{padding:5px 7px}
.items td.sl{width:34px;color:var(--ink2);text-align:center}
.items .q{width:90px}.items .r{width:110px}.items .u{width:84px}.items .tt{width:120px}
.totalbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;padding:12px 4px 0}
.totalbar b{font-size:18px}
.stick{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;box-shadow:0 -6px 14px -10px #0006}

.steps{display:flex;gap:0;flex-wrap:wrap}
.step{flex:1 1 120px;padding:8px 10px;border-top:3px solid var(--line);font-size:12.5px;color:var(--ink2)}
.step.done{border-color:var(--good);color:var(--ink)}
.step.cur{border-color:var(--accent);color:var(--ink);font-weight:600}
.step.stop{border-color:var(--bad);color:var(--bad)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px 16px}
.kv div small{display:block;font-size:11.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.kv div span{display:block;overflow-wrap:anywhere}

.bars{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:18px}
.bars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.bars .b{width:100%;max-width:34px;background:var(--bar);border-radius:3px 3px 0 0;min-height:2px}
.bars .v{font-size:10.5px;color:var(--ink2);white-space:nowrap}
.bars .m{font-size:10.5px;color:var(--ink2);white-space:nowrap}
.hb{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:12.5px}
.hb .track{background:var(--surface2);border-radius:3px;height:12px;overflow:hidden;position:relative}
.hb .fill{background:var(--bar);height:100%}
.hb .fill2{background:var(--good);height:100%;position:absolute;left:0;top:0;opacity:.85}
.leg{display:flex;gap:14px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.empty{padding:34px 16px;text-align:center;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 12px;font-size:12.5px}
.note.info{background:var(--info-soft);color:var(--info)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:99px;cursor:pointer;font-size:12.5px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
details.box{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.box>summary{padding:10px 14px;cursor:pointer;font-weight:600}
details.box>div{padding:0 14px 14px}

#modal{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;z-index:50;overflow:auto}
#modal .mb{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(520px,100%)}
#modal h2{margin-bottom:12px;font-size:16px}
#toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(360px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px -8px #0008}
.toast.bad{background:var(--bad);color:#fff}

/* Printable documents. Fixed paper colours on purpose: these are the pages a vendor or authority receives. */
.paper-wrap{overflow-x:auto;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:14px}
.paper{background:#fff;color:#111;width:794px;max-width:none;margin:0 auto;padding:36px 44px 44px;font-family:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;font-size:13px;line-height:1.4;box-shadow:0 1px 8px #0003}
.paper *{color:inherit}
.paper .lh{border-bottom:2px solid #0b5f7d;padding-bottom:6px;margin-bottom:10px;text-align:center}
.paper .lh img{display:block;height:64px;width:auto;max-width:100%;margin:0 auto 4px}
.paper .lhaddr{font-size:11.5px;color:#333}
.paper .lhsub{font-size:10.5px;letter-spacing:.28em;color:#445;text-transform:uppercase;margin-top:2px}
.paper h4{margin:0 0 6px;text-align:center;font-size:15px;border:1px solid #222;padding:4px;letter-spacing:.02em}
.paper table{width:100%;border-collapse:collapse}
.paper th,.paper td{border:1px solid #222;padding:4px 7px;vertical-align:top;font-size:12.5px}
.paper th{background:#eef2f4;text-align:center}
.paper td.r{text-align:right}.paper td.c{text-align:center}
.paper .row2{display:flex;justify-content:space-between;gap:10px}
.paper .terms{margin:8px 0 0;padding:0;list-style:none}
.paper .terms li{display:flex;gap:8px;margin:2px 0}
.paper .terms li i{font-style:normal;width:16px;flex:none;text-align:right}
.paper .terms .kvv{display:flex;flex:1;gap:8px}
.paper .terms .kvv span:first-child{width:200px;flex:none}
.paper .sign{display:flex;justify-content:space-between;gap:20px;margin-top:70px}
.paper .sign div{min-width:150px;text-align:center;border-top:1px solid #222;padding-top:4px;font-size:12.5px}
.paper .tiny{font-size:11px;color:#444}
.paper .ok{background:#e4f4ea}.paper .low{background:#dff0f6;font-weight:bold}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;flex-direction:row;align-items:center;padding:8px;overflow-x:auto;gap:8px}
  .brand{border:0;padding:0 8px 0 4px;flex:none}.brand span{display:none}
  .nav{flex-direction:row;gap:2px}.nav a{white-space:nowrap}.nav .sep{display:none}
  .rail-foot{display:none}
}
</style>

window.XLSX=(function(){
 const enc=new TextEncoder();

 function zip(files){const parts=[],cd=[];let off=0;
  files.forEach(([name,txt])=>{const nb=enc.encode(name),d=enc.encode(txt),c=crc(d);
   const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint32(14,c,true);lh.setUint32(18,d.length,true);lh.setUint32(22,d.length,true);lh.setUint16(26,nb.length,true);
   parts.push(new Uint8Array(lh.buffer),nb,d);
   const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint32(16,c,true);ch.setUint32(20,d.length,true);ch.setUint32(24,d.length,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
   cd.push(new Uint8Array(ch.buffer),nb);off+=30+nb.length+d.length});
  const cds=cd.reduce((a,b)=>a+b.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cds,true);e.setUint32(16,off,true);
  const all=[...parts,...cd,new Uint8Array(e.buffer)];const out=new Uint8Array(all.reduce((a,b)=>a+b.length,0));let p=0;all.forEach(b=>{out.set(b,p);p+=b.length});return out}
 return{utils:{book_new:()=>({sheets:[]}),aoa_to_sheet:aoa=>({aoa}),book_append_sheet:(wb,ws,name)=>wb.sheets.push({ws,name:String(name||'Sheet').replace(/[\\\/?*\[\]:]/g,' ').slice(0,31)||'Sheet'})},
  write:wb=>{const files=[['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+wb.sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+'</Types>'],

   ['xl/workbook.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+wb.sheets.map((s,i)=>'<sheet name="'+esc(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets></workbook>'],

   wb.sheets.forEach(s=>{const rows=s.ws.aoa;const cw=s.ws['!cols'];
    let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+(cw?'<cols>'+cw.map((c,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+(c.wch||10)+'" customWidth="1"/>').join('')+'</cols>':'')+'<sheetData>';

const num=v=>{const x=parseFloat(String(v==null?'':v).replace(/,/g,''));return isFinite(x)?x:0};

const compact=v=>{v=num(v);const a=Math.abs(v);if(a>=1e7)return (v/1e7).toFixed(2)+' Cr';if(a>=1e5)return (v/1e5).toFixed(2)+' L';if(a>=1e3)return (v/1e3).toFixed(1)+'K';return String(Math.round(v))};

const b1000=n=>(n>=100?ONES[Math.floor(n/100)]+' Hundred'+(n%100?' ':''):'')+(n%100?b100(n%100):'');
function words(n){n=Math.floor(n);if(n===0)return 'Zero';const o=[];const cr=Math.floor(n/1e7);n%=1e7;const lk=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1e3);n%=1e3;
  if(cr)o.push(b1000(cr)+' Crore');if(lk)o.push(b100(lk)+' Lakh');if(th)o.push(b100(th)+' Thousand');if(n)o.push(b1000(n));return o.join(' ')}
function takaWords(v){v=r2(v);const w=Math.floor(v);const p=Math.round((v-w)*100);return words(w)+' taka'+(p?' and '+words(p)+' paisa':'')+' Only'}

function campusKey(loc){const t=(loc||'').toLowerCase();if(!t.trim())return 'Unspecified';const hit=[];
  if(/port/.test(t))hit.push('Port Campus');if(/junior|\bjr\b|\bjc\b/.test(t))hit.push('Junior Campus');if(/boys|\bbc\b/.test(t))hit.push('Boys Campus');

function periodOf(p,fy){/* period label for a date given FY start month */ if(!p.date)return null;const y=+p.date.slice(0,4),m=+p.date.slice(5,7);const s=fy||1;if(s===1)return String(y);const start=m>=s?y:y-1;return start+'-'+String((start+1)%100).padStart(2,'0')}
function periodRange(label,fy){const s=fy||1;const y=parseInt(label,10);if(s===1)return[y+'-01-01',y+'-12-31'];const e=new Date(y+1,s-1,0);return[y+'-'+pad(s,2)+'-01',e.getFullYear()+'-'+pad(e.getMonth()+1,2)+'-'+pad(e.getDate(),2)]}

function recalcPO(){const rows=$$('#itemsBody tr');if(!rows.length)return;let tot=0;
  rows.forEach((tr,i)=>{$('.sl',tr).textContent=i+1;const t=r2(num($('.q',tr).value)*num($('.r',tr).value));tot+=t;$('.tt',tr).textContent=money(t)});
  tot=r2(tot);$('#grand').textContent=money(tot);$('#inWords').textContent=tot?'In words: '+takaWords(tot):'';
  const a=$('#advAmt');if(a)a.textContent=tot&&num($('#f-adv').value)?'Advance ≈ ৳ '+money(tot*num($('#f-adv').value)/100):''}

/* ---- vendor + address dropdowns ---- */
const normA=s=>String(s||'').replace(/\s+/g,' ').trim();
function vendorKnown(n){n=normA(n).toLowerCase();return !!n&&vendorList().some(v=>normA(v.name).toLowerCase()===n)}
function vendorAddrs(name){const k=normA(name).toLowerCase();const out=[];const seen=new Set();
  const add=a=>{a=normA(a);if(a&&!seen.has(a.toLowerCase())){seen.add(a.toLowerCase());out.push(a)}};
  Object.values(S.pos).filter(p=>normA(p.vendor).toLowerCase()===k).sort((a,b)=>b.no-a.no).forEach(p=>add(p.address));
  Object.values(S.vendors).filter(v=>normA(v.name).toLowerCase()===k).forEach(v=>add(v.address));return out}
function addrKnown(name,addr){const a=normA(addr).toLowerCase();return !!a&&vendorAddrs(name).some(x=>x.toLowerCase()===a)}
function vendorSelHTML(cur){const l=vendorList(),known=vendorKnown(cur);
  return `<select id="f-vendorSel" data-bind="vendorSel"><option value="">Select a vendor…</option>${l.map(v=>`<option value="${esc(v.name)}"${known&&normA(v.name).toLowerCase()===normA(cur).toLowerCase()?' selected':''}>${esc(v.name)}</option>`).join('')}<option value="__new"${cur&&!known?' selected':''}>+ New vendor…</option></select>`}
function addrSelHTML(name,cur){const l=vendorAddrs(name),known=addrKnown(name,cur);
  return `<select id="f-addrSel" data-bind="addrSel"><option value="">${l.length?'Select an address…':'Select a vendor first'}</option>${l.map(a=>`<option value="${esc(a)}"${known&&a.toLowerCase()===normA(cur).toLowerCase()?' selected':''}>${esc(a)}</option>`).join('')}<option value="__other"${cur&&!known?' selected':''}>+ Other address…</option></select>`}
function syncVendorUI(){const vn=$('#f-vendor').value,ad=$('#f-address').value;
  $('#f-vendorSel').outerHTML=vendorSelHTML(vn);$('#f-addrSel').outerHTML=addrSelHTML(vn,ad);
  $('#f-vendor').hidden=vendorKnown(vn)||!vn&&$('#f-vendorSel').value!=='__new';$('#f-address').hidden=addrKnown(vn,ad)||!ad&&$('#f-addrSel').value!=='__other'}
BIND.vendorSel=el=>{const val=el.value;const vi=$('#f-vendor'),ai=$('#f-address');
  if(val==='__new'){vi.value='';vi.hidden=false;ai.value='';$('#f-addrSel').outerHTML=addrSelHTML('','');$('#f-addrSel').value='__other';ai.hidden=false;vi.focus();return}
  vi.hidden=true;vi.value=val;const l=vendorAddrs(val);ai.value=l[0]||'';ai.hidden=!!l[0];$('#f-addrSel').outerHTML=addrSelHTML(val,ai.value);if(!l[0]){$('#f-addrSel').value=val?'__other':'';ai.hidden=!val}};
BIND.addrSel=el=>{const ai=$('#f-address');if(el.value==='__other'){ai.value='';ai.hidden=false;ai.focus()}else{ai.value=el.value;ai.hidden=true}};

BIND.csPick=el=>{const cs=Object.values(S.cs).find(x=>x.ref===el.value);if(!cs)return;const rec=cs.rec||0,ven=cs.vendors[rec]||{};
  $('#f-vendor').value=ven.name||'';$('#f-address').value=ven.address||'';syncVendorUI();$('#f-attention').value=ven.contact||'';

  $('#itemsBody').innerHTML=cs.items.map((i,k)=>itemRow({particulars:i.particulars,uom:i.uom,qty:i.qty,rate:(i.rates||[])[rec]||0},k)).join('');recalcPO();toast('Vendor and rates filled from '+cs.ref)};

ACT.delRow=el=>{const b=$('#itemsBody');if(b.children.length<=1){toast('At least one item row is needed','bad');return}el.closest('tr').remove();recalcPO()};
ACT.savePO=btn=>{
  const g=id=>$('#f-'+id).value.trim();const err=m=>{$('#poErr').textContent=m;return false};
  const editNo=btn.dataset.edit?+btn.dataset.edit:null;const old=editNo?S.pos[String(editNo)]:null;
  const items=$$('#itemsBody tr').map(tr=>({particulars:$('.p',tr).value.trim(),uom:$('.u',tr).value,qty:num($('.q',tr).value),rate:num($('.r',tr).value)})).filter(i=>i.particulars||i.qty||i.rate);
  if(!g('vendor'))return err('Enter the vendor name.');if(!g('date'))return err('Select the PO date.');
  if(!items.length||items.some(i=>!i.particulars||i.qty<=0))return err('Each item needs a description and a quantity above zero.');
  const amount=r2(sum(items,i=>i.qty*i.rate));if(amount<=0)return err('Total amount must be above zero.');
  const no=editNo||nextPoNo();const c=cfg();
  const terms={delivery:g('delivery'),days:num(g('days'))||c.terms.days,advancePct:num(g('adv')),credit:g('credit'),method:g('method'),tax:g('tax'),general:$('#f-general').value.split('\n').map(s=>s.trim()).filter(Boolean)};
  const o=Object.assign({},old||{},{no,ref:c.poPrefix+no,date:g('date'),vendor:g('vendor'),address:g('address'),attention:g('attention'),desc:g('desc')||items[0].particulars,location:g('location'),category:g('category')||'Others',
    items,amount,csRef:g('csRef'),terms,cc:$('#f-cc').value.split('\n').map(s=>s.trim()).filter(Boolean),recName:g('rec'),appName:g('app')});
  delete o.dateFlag;
  if(!old)Object.assign(o,{finalBill:null,remark:'',mrOmr:'',billUpdate:'',chequeNo:'',payments:[],status:'Issued',wccRefs:[],createdAt:todayISO()});
  put('pos',String(no),o);
  if(!old)saveSettings({nextPO:no+1});
  if(o.csRef){const cs=Object.values(S.cs).find(x=>x.ref===o.csRef);if(cs){const n2=clone(cs);n2.poRef=o.ref;n2.status='PO Issued';put('cs',String(cs.no),n2)}}
  const vk=slug(o.vendor);const ve=S.vendors[vk];if(!ve)put('vendors',vk,{name:o.vendor,address:o.address,phone:'',trade:''});else if(!ve.address&&o.address){const v2=clone(ve);v2.address=o.address;put('vendors',vk,v2)}
  toast(old?o.ref+' updated':o.ref+' created and added to the Tracker');go('po-'+no)};

  <div class="card"><div class="steps">${steps}</div></div>
  <div class="grid g2">
   <div class="card"><h2>Order</h2><div class="kv">
     <div><small>Vendor</small><span>${esc(p.vendor)}</span></div><div><small>Address</small><span>${esc(p.address)||'—'}</span></div>
     <div><small>Location</small><span>${esc(p.location)||'—'}</span></div><div><small>Category</small><span>${esc(p.category||'—')}</span></div>
     <div style="grid-column:1/-1"><small>Work description</small><span>${esc(p.desc)}</span></div>
     <div><small>Comparative statement</small><span>${cs?`<a class="tag" href="#cs-${cs.no}" data-go="cs-${cs.no}">${esc(cs.ref)}</a>`:(p.csRef?esc(p.csRef):'None')}</span></div>
     <div><small>Work completion certificate</small><span>${wcc.length?wcc.join(', '):'None yet'}</span></div></div></div>
   <div class="card"><h2>Money</h2><div class="kv">
     <div><small>PO amount</small><span class="mono">৳ ${money(p.amount)}</span></div>
     <div><small>Final bill</small><span><input id="d-final" type="number" step="any" value="${p.finalBill||''}" placeholder="Same as PO" style="width:150px"> <button class="btn sm" data-act="saveFinal" data-no="${p.no}">Save</button></span></div>
     <div><small>Paid</small><span class="mono">৳ ${money(paid)}</span>${p.status==='Paid'&&poRec(p)<base-0.5?'<span class="hint">No payment entries recorded. Add them to keep the ledger complete.</span>':''}</div>
     <div><small>Due</small><span class="mono" style="${due?'color:var(--bad);font-weight:600':''}">৳ ${money(due)}</span></div></div>
     ${poRec(p)>base+0.5&&p.status!=='Cancelled'?'<p class="err">Paid amount is more than the bill value. Check the payment entries.</p>':''}</div>
  </div>
  <div class="card"><div class="card-h"><h2>Payments</h2><button class="btn sm primary" data-act="addPay" data-no="${p.no}">+ Add payment</button></div>
   ${(p.payments||[]).length?`<div class="tw"><table class="t"><thead><tr><th>Date</th><th>Type</th><th class="num">Amount</th><th>Cheque / ref</th><th></th></tr></thead><tbody>${p.payments.map((x,i)=>`<tr><td>${dmy(x.date)}</td><td>${esc(x.type)}</td><td class="num">${money(x.amount)}</td><td>${esc(x.ref||'')}</td><td><button class="btn sm ghost" data-act="delPay" data-no="${p.no}" data-i="${i}" aria-label="Delete payment">✕</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No payments recorded.</div>'}</div>
  <div class="card"><h2>Tracker notes</h2><div class="frm">
    <div class="fld"><label class="lbl" for="d-status">Status</label><select id="d-status" data-bind="poStatus" data-no="${p.no}">${opts(STATUSES,p.status)}</select></div>
    <div class="fld"><label class="lbl" for="d-remark">Remark</label><input id="d-remark" type="text" value="${esc(p.remark||'')}"></div>
    <div class="fld"><label class="lbl" for="d-mr">MR / OMR</label><input id="d-mr" type="text" value="${esc(p.mrOmr||'')}"></div>
    <div class="fld"><label class="lbl" for="d-bill">Bill update</label><input id="d-bill" type="text" value="${esc(p.billUpdate||'')}"></div>
    <div class="fld"><label class="lbl" for="d-cq">CQ number</label><input id="d-cq" type="text" value="${esc(p.chequeNo||'')}"></div>
    <div class="fld" style="justify-content:flex-end"><button class="btn primary" data-act="saveNotes" data-no="${p.no}">Save notes</button></div></div>
    <div class="actions" style="margin-top:12px">${p.status==='Cancelled'?`<button class="btn" data-act="setStat" data-no="${p.no}" data-s="Issued">Reopen PO</button>`:`<button class="btn danger" data-act="cancelPO" data-no="${p.no}">Cancel PO</button>`}</div></div>
  <details class="box"><summary>PO document preview</summary><div><div class="paper-wrap"><div class="paper">${docPO(p)}</div></div></div></details>`};
function patchPO(no,fn){const p=clone(S.pos[String(no)]);fn(p);put('pos',String(no),p);render()}
BIND.poStatus=el=>patchPO(el.dataset.no,p=>{p.status=el.value;if(el.value==='Bill Submitted'&&!p.billUpdate)p.billUpdate='Bill submitted '+dmy(todayISO())});
ACT.setStat=el=>patchPO(el.dataset.no,p=>{p.status=el.dataset.s});
ACT.saveFinal=el=>{const v=$('#d-final').value;patchPO(el.dataset.no,p=>{p.finalBill=v===''?null:num(v)});toast('Final bill saved')};
ACT.saveNotes=el=>{patchPO(el.dataset.no,p=>{p.remark=$('#d-remark').value.trim();p.mrOmr=$('#d-mr').value.trim();p.billUpdate=$('#d-bill').value.trim();p.chequeNo=$('#d-cq').value.trim()});toast('Notes saved')};
ACT.cancelPO=el=>confirmBox('Cancel <b>'+esc(refOf(S.pos[el.dataset.no]))+'</b>? It stays in the tracker as Cancelled and is left out of totals.','Cancel PO',()=>patchPO(el.dataset.no,p=>{p.status='Cancelled'}),true);
ACT.dlPO=el=>{const p=S.pos[el.dataset.no];printFile('PO '+refOf(p),docPO(p),'PO-'+p.no+'.html')};
ACT.addPay=el=>{const p=S.pos[el.dataset.no];const first=!(p.payments||[]).length;
  modal(`<h2>Add payment · ${esc(refOf(p))}</h2><div class="frm" style="grid-template-columns:1fr 1fr">
   <div class="fld"><label class="lbl" for="m-date">Date</label><input id="m-date" type="date" value="${todayISO()}"></div>
   <div class="fld"><label class="lbl" for="m-type">Type</label><select id="m-type">${opts(['Advance','Part payment','Final'],first&&num((p.terms||{}).advancePct)?'Advance':(poDue(p)?'Final':'Part payment'))}</select></div>
   <div class="fld"><label class="lbl" for="m-amt">Amount (৳)</label><input id="m-amt" type="number" step="any" value="${poDue(p)||''}"></div>
   <div class="fld"><label class="lbl" for="m-ref">Cheque / ref no.</label><input id="m-ref" type="text"></div></div>
   <div class="actions" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" id="m-ok">Save payment</button></div>`);
  $('#m-ok').onclick=()=>{const a=num($('#m-amt').value);if(a<=0){toast('Enter an amount above zero','bad');return}
    const pay={date:$('#m-date').value,type:$('#m-type').value,amount:a,ref:$('#m-ref').value.trim()};closeModal();
    patchPO(el.dataset.no,q=>{q.payments=(q.payments||[]).concat(pay);if(pay.ref)q.chequeNo=q.chequeNo||pay.ref;
      if(q.status!=='Cancelled'){if(poRec(q)>=poBase(q)-0.5){q.status='Paid'}else if(q.status==='Issued')q.status='In Progress'}});toast('Payment recorded')}};
ACT.delPay=el=>confirmBox('Delete this payment entry?','Delete',()=>patchPO(el.dataset.no,p=>{p.payments.splice(+el.dataset.i,1)}),true);
/* ========== printable documents ========== */
const letterhead=(c,sub)=>`<div class="lh"><img src="${LOGO}" alt="${esc(c.org)}"><div class="lhaddr">${esc(c.orgAddr||'')}</div>${sub?`<div class="lhsub">${esc(sub)}</div>`:''}</div>`;
const signBlock=l=>`<div class="sign">${l.map(x=>`<div>${esc(x[0])}${x[2]?`<br><span class="tiny">${x[2]}</span>`:x[1]?`<br><span class="tiny">${esc(x[1])}</span>`:''}</div>`).join('')}</div>`;
function poItems(p){return(p.items&&p.items.length)?p.items:[{particulars:p.desc,uom:'Lot',qty:1,rate:p.amount}]}
function docPO(p){
  const c=cfg(),t=Object.assign({},c.terms,p.terms||{}),items=poItems(p),total=(p.items&&p.items.length)?r2(sum(items,i=>i.qty*i.rate)):r2(p.amount);
  const place=t.delivery||p.location||'campus';const d=num(t.days)||10;
  const terms=[`The ordered services should be delivered to our <b>${esc(place)}</b> at your own risk and responsibility.`,
    `The works should be completed within ${d} (${words(d)}) days from Work Order issue date.`].concat((t.general||[]).map(esc));
  const kv=[['Advance :',(num(t.advancePct)||0)+'% of Total Quotation Price'],['Payment Credit :',t.credit],['Payment Method:',t.method],['This PO Amount is',t.tax]];
  let n=0;
  return letterhead(c)+`<h4>Work Order</h4>
  <div class="row2"><span><b>WO: ${esc(refOf(p))}</b></span><span>Date: ${dmy(p.date)}</span></div>
  ${p.csRef?`<div class="tiny">Ref: Comparative Statement ${esc(p.csRef)}</div>`:''}
  <p style="margin:8px 0 6px"><b>To</b>&nbsp;&nbsp;&nbsp;${esc(p.vendor)}<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${esc(p.address||'')}</p>
  ${p.attention?`<p style="margin:0">Attention,<br><b>${esc(p.attention)}</b></p>`:''}
  <p style="margin:6px 0">Dear Concern,<br><b>${esc(c.org)} management is pleased to issue the work order for following items with terms and conditions appended below:</b></p>
  <table><thead><tr><th style="width:34px">SL</th><th>Particulars</th><th style="width:56px">UoM</th><th style="width:64px">QTY</th><th style="width:84px">Unit Price</th><th style="width:96px">Total Price</th></tr></thead><tbody>
  ${items.map((i,k)=>`<tr><td class="c">${k+1}</td><td>${esc(i.particulars).replace(/\n/g,'<br>')}</td><td class="c">${esc(i.uom)}</td><td class="c">${num(i.qty)}</td><td class="r">${money(i.rate)}</td><td class="r">${money(i.qty*i.rate)}</td></tr>`).join('')}
  <tr><td colspan="5" class="r">Total Amount</td><td class="r"><b>${money(total)}</b></td></tr></tbody></table>
  <p style="margin:8px 0"><b>In-Word: ${takaWords(total)}</b></p>
  <ul class="terms">${terms.map(x=>`<li><i>${++n}</i><span>${x}</span></li>`).join('')}${kv.map(k=>`<li><i>${++n}</i><span class="kvv"><span>${esc(k[0])}</span><span>${esc(k[1])}</span></span></li>`).join('')}</ul>
  ${(p.cc&&p.cc.length)||c.cc.length?`<div style="margin-top:8px">CC<ul class="terms">${(p.cc&&p.cc.length?p.cc:c.cc).map((x,k)=>`<li><i>${k+1}</i><span>${esc(x)}</span></li>`).join('')}</ul></div>`:''}
  ${signBlock([['Recommended by',p.recName],['Approved by',p.appName]])}`}

function csTotals(cs){return cs.vendors.map((v,j)=>r2(sum(cs.items,i=>num(i.qty)*num((i.rates||[])[j]))))}
function csLowest(tot){let b=-1;tot.forEach((t,j)=>{if(t>0&&(b<0||t<tot[b]))b=j});return b}
function docCS(cs){
  const c=cfg(),tot=csTotals(cs),low=csLowest(tot),rec=cs.rec||0,hi=Math.max(...tot);
  const nv=cs.vendors.length;
  return letterhead(c)+`<h4>Comparative Statement</h4>
  <div class="row2"><span><b>CS No: ${esc(cs.ref)}</b></span><span>Date: ${dmy(cs.date)}</span></div>
  <p style="margin:6px 0"><b>Work:</b> ${esc(cs.title)}${cs.location?` &nbsp;·&nbsp; <b>Location:</b> ${esc(cs.location)}`:''}${cs.category?` &nbsp;·&nbsp; <b>Head:</b> ${esc(cs.category)}`:''}</p>
  <table style="font-size:11px"><thead><tr><th rowspan="2" style="width:28px">SL</th><th rowspan="2">Particulars</th><th rowspan="2" style="width:42px">UoM</th><th rowspan="2" style="width:44px">Qty</th>
   ${cs.vendors.map((v,j)=>`<th colspan="2" class="${j===rec?'ok':''}">${esc(v.name)}${j===rec?'<br><span class="tiny">(recommended)</span>':''}</th>`).join('')}</tr>
   <tr>${cs.vendors.map(()=>'<th>Rate</th><th>Amount</th>').join('')}</tr></thead><tbody>
  ${cs.items.map((i,k)=>`<tr><td class="c">${k+1}</td><td>${esc(i.particulars).replace(/\n/g,'<br>')}</td><td class="c">${esc(i.uom)}</td><td class="c">${num(i.qty)}</td>${cs.vendors.map((v,j)=>`<td class="r">${money((i.rates||[])[j])}</td><td class="r">${money(num(i.qty)*num((i.rates||[])[j]))}</td>`).join('')}</tr>`).join('')}
  <tr><td colspan="4" class="r"><b>Total</b></td>${tot.map((t,j)=>`<td colspan="2" class="r ${j===low?'low':''}"><b>${money(t)}</b>${j===low?'<br><span class="tiny">Lowest</span>':''}</td>`).join('')}</tr></tbody></table>
  <p style="margin:8px 0"><b>Recommended vendor:</b> ${esc((cs.vendors[rec]||{}).name||'')} at ৳ ${money(tot[rec])}${low>=0&&rec!==low?` (not the lowest; lowest is ${esc(cs.vendors[low].name)} at ৳ ${money(tot[low])})`:''}.<br>
  ${nv>1&&hi>0?`<span class="tiny">Difference between highest and recommended quotation: ৳ ${money(hi-tot[rec])}</span><br>`:''}
  ${cs.justification?`<b>Justification:</b> ${esc(cs.justification)}`:''}</p>
  ${cs.poRef?`<p class="tiny">Work order issued: ${esc(cs.poRef)}</p>`:''}
  ${signBlock([['Prepared by',cs.preparedBy],['Recommended by',''],['Approved by','']])}`}

function wccPO(w){return S.pos[String(w.poNo)]}
function docWCC(w){
  const c=cfg(),p=wccPO(w)||{};const paid=poPaid(p);const gross=r2(sum(w.items,i=>num(i.executed)*num(i.rate)));const net=r2(gross-num(w.deduction));
  const qcLoc=(w.location||p.location||'').trim();const qcLine=(w.qcBy?esc(w.qcBy)+', ':'')+'Campus Admin'+(qcLoc?' – '+esc(qcLoc):'');
  const due=p.date&&p.terms&&p.terms.days?addDays(p.date,num(p.terms.days)):'';const late=due&&w.completionDate?daysBetween(due,w.completionDate):0;
  return letterhead(c)+`<h4>Work Completion Certificate</h4>
  <div class="row2"><span><b>WCC No: ${esc(w.ref)}</b></span><span>Date: ${dmy(w.date)}</span></div>
  <table style="margin:8px 0"><tbody>
   <tr><td style="width:150px"><b>Work Order (PO) No</b></td><td>${esc(w.poRef)}${w.csRef?` &nbsp;·&nbsp; CS: ${esc(w.csRef)}`:''}</td></tr>
   <tr><td><b>Contractor / Vendor</b></td><td>${esc(w.vendor)}<br><span class="tiny">${esc(w.address||'')}</span></td></tr>
   <tr><td><b>Work</b></td><td>${esc(w.desc)}</td></tr>
   <tr><td><b>Location</b></td><td>${esc(w.location||'')}</td></tr>
   <tr><td><b>Work period</b></td><td>Started: ${dmy(w.startDate)} &nbsp;·&nbsp; Completed: ${dmy(w.completionDate)}${late>0?` &nbsp;·&nbsp; <b>Delayed ${late} day(s)</b> against the ${esc(String(p.terms.days))}-day completion term`:''}</td></tr></tbody></table>
  <table><thead><tr><th style="width:30px">SL</th><th>Particulars</th><th style="width:48px">UoM</th><th style="width:62px">Ordered</th><th style="width:62px">Executed</th><th style="width:72px">Rate</th><th style="width:92px">Amount</th></tr></thead><tbody>
  ${w.items.map((i,k)=>`<tr><td class="c">${k+1}</td><td>${esc(i.particulars).replace(/\n/g,'<br>')}</td><td class="c">${esc(i.uom)}</td><td class="c">${num(i.ordered)}</td><td class="c">${num(i.executed)}</td><td class="r">${money(i.rate)}</td><td class="r">${money(num(i.executed)*num(i.rate))}</td></tr>`).join('')}
  <tr><td colspan="6" class="r">Value of work executed</td><td class="r">${money(gross)}</td></tr>
  ${num(w.deduction)?`<tr><td colspan="6" class="r">Less deduction${w.deductionReason?' ('+esc(w.deductionReason)+')':''}</td><td class="r">(${money(w.deduction)})</td></tr>`:''}
  <tr><td colspan="6" class="r"><b>Net certified amount</b></td><td class="r"><b>${money(net)}</b></td></tr>
  <tr><td colspan="6" class="r">Paid so far (advance and part payments)</td><td class="r">${money(paid)}</td></tr>
  <tr><td colspan="6" class="r"><b>Balance payable after quality check</b></td><td class="r"><b>${money(Math.max(0,net-paid))}</b></td></tr></tbody></table>
  <p style="margin:8px 0"><b>In-Word (net certified): ${takaWords(net)}</b></p>
  <table><tbody>${w.checklist.map(x=>`<tr><td style="width:24px" class="c">${x.ok?'✔':'✘'}</td><td>${esc(x.label)}</td></tr>`).join('')}</tbody></table>
  ${w.remarks?`<p style="margin:8px 0"><b>Remarks:</b> ${esc(w.remarks)}</p>`:''}
  <p style="margin:8px 0">It is certified that the above work has been inspected and quality-checked by the Campus Admin${qcLoc?' of '+esc(qcLoc):''}, and ${w.checklist.every(x=>x.ok)?'found complete and satisfactory':'found as noted above'}. Payment may be processed as per the terms of the work order.</p>
  ${signBlock([['Vendor representative',''],['Certified by (Maintenance)',w.certifiedBy],['Quality check by',null,qcLine],['Approved by',w.approvedBy]])}`}

/* ========== Comparative statement ========== */
VIEWS.cs=()=>{
  const l=Object.values(S.cs).sort((a,b)=>b.no-a.no);
  return head('Comparative Statement','Compare vendor quotations, recommend one, then raise the PO from it with the CS reference attached.','<a class="btn primary" data-go="new-cs">+ New CS</a>')+
  (l.length?`<div class="tw"><table class="t"><thead><tr><th>CS Ref</th><th>Date</th><th>Work</th><th>Vendors</th><th class="num">Lowest quote</th><th>Recommended</th><th class="num">Amount</th><th>Status</th><th>PO</th></tr></thead><tbody>
  ${l.map(cs=>{const t=csTotals(cs),lo=csLowest(t),rec=cs.rec||0;return `<tr class="click" data-go="cs-${cs.no}"><td><span class="tag">${esc(cs.ref)}</span></td><td>${dmy(cs.date)}</td><td class="wide">${esc(cs.title)}</td><td>${cs.vendors.length}</td><td class="num">${lo>=0?m0(t[lo]):'—'}</td><td>${esc((cs.vendors[rec]||{}).name||'')}</td><td class="num">${m0(t[rec])}</td><td><span class="pill ${cs.status==='PO Issued'?'good':cs.status==='Approved'?'info':''}">${esc(cs.status)}</span></td><td>${cs.poRef?`<a class="tag" href="#po-${cs.poRef.split('/').pop()}" data-go="po-${cs.poRef.split('/').pop()}">${esc(cs.poRef)}</a>`:'—'}</td></tr>`}).join('')}</tbody></table></div>`
  :`<div class="card empty"><b>No comparative statements yet</b>Create one before you raise a PO for larger jobs.<div style="margin-top:14px"><a class="btn primary" data-go="new-cs">Create first CS</a></div></div>`)};
VIEWS['cs-view']=r=>{const cs=S.cs[r.id];if(!cs)return notFound('Comparative statement','cs');
  return head(`<span class="mono">${esc(cs.ref)}</span> <span class="pill ${cs.status==='PO Issued'?'good':cs.status==='Approved'?'info':''}">${esc(cs.status)}</span>`,esc(cs.title),
   `<a class="btn" data-go="cs">← All CS</a>${cs.poRef?'':`<a class="btn" data-go="edit-cs-${cs.no}">Edit</a>${cs.status==='Draft'?`<button class="btn" data-act="csApprove" data-no="${cs.no}">Mark approved</button>`:''}<a class="btn primary" data-go="new-po-cs-${cs.no}">Create PO from this CS</a><button class="btn danger" data-act="csDelete" data-no="${cs.no}">Delete</button>`}<button class="btn" data-act="csDownload" data-no="${cs.no}">Print / Save PDF</button>`)+
  `<div class="paper-wrap"><div class="paper">${docCS(cs)}</div></div>`};
ACT.csApprove=el=>{const c=clone(S.cs[el.dataset.no]);c.status='Approved';put('cs',el.dataset.no,c);toast('Marked approved');render()};
ACT.csDelete=el=>confirmBox('Delete '+esc(S.cs[el.dataset.no].ref)+'? This cannot be undone.','Delete',()=>{del('cs',el.dataset.no);go('cs')},true);
ACT.csDownload=el=>{const c=S.cs[el.dataset.no];printFile('CS '+c.ref,docCS(c),'CS-'+pad(c.no,4)+'.html')};

function csModel(cs){return cs?clone(cs):{date:todayISO(),title:'',location:'',category:'',vendors:[{name:'',address:'',contact:''},{name:'',address:'',contact:''},{name:'',address:'',contact:''}],items:[{particulars:'',uom:'Nos',qty:'',rates:[]}],rec:0,justification:'',preparedBy:'',status:'Draft'}}
function csTableHTML(m){const c=cfg();const nv=m.vendors.length;
  return `<table class="t items"><thead><tr><th>SL</th><th style="min-width:200px">Particulars</th><th>UoM</th><th>Qty</th>
   ${m.vendors.map((v,j)=>`<th style="min-width:190px;vertical-align:top"><select class="vp" data-bind="csVendorPick" data-j="${j}" aria-label="Pick vendor ${j+1}" style="margin-bottom:4px;font-weight:400"><option value="">Pick from vendor list…</option>${vendorList().map(x=>`<option value="${esc(x.name)}"${normA(x.name).toLowerCase()===normA(v.name).toLowerCase()?' selected':''}>${esc(x.name)}</option>`).join('')}</select><div style="display:flex;gap:4px"><input class="vn" type="text" value="${esc(v.name)}" placeholder="Vendor ${j+1} name" aria-label="Vendor ${j+1} name">${nv>2?`<button type="button" class="btn sm ghost" data-act="csDelVendor" data-j="${j}" aria-label="Remove vendor">✕</button>`:''}</div><input class="va" type="text" value="${esc(v.address||'')}" placeholder="Address" style="margin-top:4px;font-weight:400"><input class="vc" type="text" value="${esc(v.contact||'')}" placeholder="Contact person" style="margin-top:4px;font-weight:400"></th>`).join('')}<th></th></tr></thead>
   <tbody id="csBody" data-bind="csCalc">${m.items.map((i,k)=>`<tr><td class="sl">${k+1}</td><td><textarea class="p" rows="2">${esc(i.particulars||'')}</textarea></td><td><select class="u">${opts(c.uoms.includes(i.uom)?c.uoms:c.uoms.concat(i.uom||[]),i.uom||'Nos')}</select></td><td><input class="q" type="number" step="any" min="0" value="${i.qty??''}"></td>
    ${m.vendors.map((v,j)=>`<td><input class="rt" type="number" step="any" min="0" value="${(i.rates||[])[j]??''}" placeholder="Rate" aria-label="Rate"></td>`).join('')}<td><button type="button" class="btn sm ghost" data-act="csDelRow" data-k="${k}" aria-label="Remove row">✕</button></td></tr>`).join('')}</tbody>
   <tfoot><tr><td colspan="4">Total quotation</td>${m.vendors.map((v,j)=>`<td class="num" id="ct${j}">0.00</td>`).join('')}<td></td></tr>
   <tr><td colspan="4">Recommend</td>${m.vendors.map((v,j)=>`<td><label><input type="radio" name="csRec" value="${j}" ${(m.rec||0)===j?'checked':''} data-bind="csCalc"> Recommended <span id="cl${j}"></span></label></td>`).join('')}<td></td></tr></tfoot></table>`}
function readCS(){const m=state.csm;
  m.vendors=$$('#csTable thead th').filter(th=>th.querySelector('.vn')).map(th=>({name:$('.vn',th).value.trim(),address:$('.va',th).value.trim(),contact:$('.vc',th).value.trim()}));
  m.items=$$('#csBody tr').map(tr=>({particulars:$('.p',tr).value.trim(),uom:$('.u',tr).value,qty:$('.q',tr).value,rates:$$('.rt',tr).map(x=>x.value)}));
  const rr=$('input[name=csRec]:checked');m.rec=rr?+rr.value:0;return m}
function drawCS(){$('#csTable').innerHTML=csTableHTML(state.csm);recalcCS()}
function recalcCS(){const m=state.csm;const rows=$$('#csBody tr');const tot=m.vendors.map((v,j)=>r2(sum(rows,tr=>num($('.q',tr).value)*num($$('.rt',tr)[j].value))));
  tot.forEach((t,j)=>{$('#ct'+j).textContent=money(t)});rows.forEach((tr,k)=>{$('.sl',tr).textContent=k+1});
  const lo=csLowest(tot);tot.forEach((t,j)=>{$('#cl'+j).innerHTML=j===lo?'<span class="pill good">Lowest</span>':''});
  const rr=$('input[name=csRec]:checked');const rec=rr?+rr.value:0;const w=$('#csWarn');
  w.hidden=!(lo>=0&&rec!==lo);if(!w.hidden)w.textContent='The recommended vendor is not the lowest quotation. Write the justification below.'}
BIND.csCalc=()=>recalcCS();

ACT.csDelVendor=el=>{const m=readCS();const j=+el.dataset.j;m.vendors.splice(j,1);m.items.forEach(i=>i.rates.splice(j,1));if(m.rec>=m.vendors.length||m.rec===j)m.rec=0;drawCS()};
ACT.csAddRow=()=>{const m=readCS();m.items.push({particulars:'',uom:'Nos',qty:'',rates:[]});drawCS()};

ACT.saveCS=btn=>{const m=readCS();const err=t=>{$('#csErr').textContent=t};
  const old=btn.dataset.edit?S.cs[btn.dataset.edit]:null;const g=id=>$('#'+id).value.trim();
  if(!g('c-title'))return err('Enter the work title.');
  const vs=m.vendors;if(vs.some(v=>!v.name))return err('Enter a name for every vendor column, or remove the empty one.');
  if(new Set(vs.map(v=>v.name.toLowerCase())).size<vs.length)return err('Two vendor columns have the same name.');
  const items=m.items.filter(i=>i.particulars||num(i.qty));
  if(!items.length||items.some(i=>!i.particulars||num(i.qty)<=0))return err('Each item needs a description and a quantity above zero.');
  if(items.some(i=>vs.some((v,j)=>num(i.rates[j])<=0)))return err('Enter a rate for every vendor on every item.');
  const no=old?old.no:nextSeq('cs');
  const o=Object.assign({},old||{},{no,ref:cfg().csPrefix+pad(no,4),date:g('c-date'),title:g('c-title'),location:g('c-loc'),category:g('c-cat'),preparedBy:g('c-by'),justification:g('c-just'),
    vendors:vs,items:items.map(i=>({particulars:i.particulars,uom:i.uom,qty:num(i.qty),rates:i.rates.map(num)})),rec:m.rec,status:old?old.status:'Draft'});
  const t=csTotals(o),lo=csLowest(t);if(lo>=0&&o.rec!==lo&&!o.justification)return err('Add a justification because the recommended vendor is not the lowest.');
  put('cs',String(no),o);if(!old)saveSettings({nextCS:no+1});toast(o.ref+' saved');go('cs-'+no)};

  const p=wccPO({poNo:state.arg.po||(S.wcc[state.arg.id]||{}).poNo});if(p&&p.date&&p.terms&&p.terms.days&&$('#w-end').value){const late=daysBetween(addDays(p.date,num(p.terms.days)),$('#w-end').value);$('#w-late').textContent=late>0?'Delayed '+late+' day(s) against the '+p.terms.days+'-day term':'Within the '+p.terms.days+'-day term'}}

  const gross=r2(sum(items,i=>i.executed*i.rate)),ded=num(g('w-ded'));if(gross<=0){$('#wErr').textContent='Executed quantity cannot be zero for every item.';return}

    items,gross,deduction:ded,deductionReason:g('w-dr'),net:r2(gross-ded),checklist:$$('#wChk input').map(x=>({label:x.dataset.l,ok:x.checked})),remarks:g('w-rem'),certifiedBy:g('w-cert'),qcBy:g('w-qc'),approvedBy:g('w-app'),updateBill:$('#w-upd').checked,status:st});
  if(st==='Certified'&&!o.certifiedOn)o.certifiedOn=todayISO();
  put('wcc',String(no),o);if(!old)saveSettings({nextWCC:no+1});
  const q=clone(S.pos[String(p.no)]);q.wccRefs=q.wccRefs||[];if(!q.wccRefs.includes(o.ref)){q.wccRefs.push(o.ref);put('pos',String(q.no),q)}

  toast(o.ref+(st==='Certified'?' certified and linked to '+o.poRef:' saved as draft'));go('wcc-'+no)};
/* ========== Budget statement ========== */
function budgetPeriods(){const fy=cfg().fyStartMonth;const s=new Set(Object.values(S.pos).map(p=>periodOf(p,fy)).filter(Boolean));s.add(periodOf({date:todayISO()},fy));Object.keys((S.meta.budget||{}).periods||{}).forEach(k=>s.add(k));return[...s].sort().reverse()}
function budgetData(label){
  const c=cfg(),[from,to]=periodRange(label,c.fyStartMonth);const bd=((S.meta.budget||{}).periods||{})[label]||{alloc:{},remarks:'',preparedBy:'',approvedBy:''};
  const pos=poList().filter(p=>p.status!=='Cancelled'&&p.date&&p.date>=from&&p.date<=to);
  const cats=c.categories.concat([...new Set(pos.map(p=>p.category||'Others'))].filter(x=>!c.categories.includes(x)));
  const rows=cats.map(k=>{const l=pos.filter(p=>(p.category||'Others')===k);const alloc=num((bd.alloc||{})[k]),com=sum(l,poBase),paid=sum(l,poPaid),due=sum(l,poDue);
    return{cat:k,alloc,n:l.length,com,paid,due,bal:alloc-com,util:alloc?com/alloc*100:null}}).filter(r=>r.alloc||r.n);
  const tot=rows.reduce((a,r)=>({alloc:a.alloc+r.alloc,n:a.n+r.n,com:a.com+r.com,paid:a.paid+r.paid,due:a.due+r.due}),{alloc:0,n:0,com:0,paid:0,due:0});
  tot.bal=tot.alloc-tot.com;tot.util=tot.alloc?tot.com/tot.alloc*100:null;
  const months={};pos.forEach(p=>{const k=monthKey(p.date);const m=months[k]=months[k]||{n:0,com:0,paid:0};m.n++;m.com+=poBase(p);m.paid+=poPaid(p)});
  const undated=poList().filter(p=>p.status!=='Cancelled'&&!p.date).length;
  return{label,from,to,bd,pos,rows,tot,months,undated,top:pos.slice().sort((a,b)=>poBase(b)-poBase(a)).slice(0,10)}}
const pct=v=>v==null?'—':v.toFixed(1)+'%';
function periodName(label){return cfg().fyStartMonth===1?'Year '+label:'FY '+label}
function docBudget(B){const c=cfg();const mk=Object.keys(B.months).sort();let cum=0;
  return letterhead(c,'Maintenance Department')+`<h4>Maintenance Budget Statement · ${esc(periodName(B.label))}</h4>
  <div class="row2"><span>Period: ${dmy(B.from)} to ${dmy(B.to)}</span><span>Statement date: ${dmy(todayISO())}</span></div>
  <p style="margin:8px 0">Approved budget ৳ ${m0(B.tot.alloc)}${B.tot.alloc?'':' (not entered)'} · Committed through work orders ৳ ${m0(B.tot.com)} (${B.tot.n} POs) · Paid ৳ ${m0(B.tot.paid)} · Outstanding payable ৳ ${m0(B.tot.due)}${B.tot.alloc?` · Balance ৳ ${m0(B.tot.bal)} · Utilisation ${pct(B.tot.util)}`:''}.</p>
  <table style="font-size:12px"><thead><tr><th>Budget head</th><th>Budget</th><th>POs</th><th>Committed</th><th>Paid</th><th>Outstanding</th><th>Balance</th><th>Used</th></tr></thead><tbody>
  ${B.rows.map(r=>`<tr><td>${esc(r.cat)}</td><td class="r">${r.alloc?m0(r.alloc):'—'}</td><td class="c">${r.n}</td><td class="r">${m0(r.com)}</td><td class="r">${m0(r.paid)}</td><td class="r">${m0(r.due)}</td><td class="r">${r.alloc?m0(r.bal):'—'}</td><td class="r">${pct(r.util)}</td></tr>`).join('')}
  <tr><td><b>Total</b></td><td class="r"><b>${m0(B.tot.alloc)}</b></td><td class="c"><b>${B.tot.n}</b></td><td class="r"><b>${m0(B.tot.com)}</b></td><td class="r"><b>${m0(B.tot.paid)}</b></td><td class="r"><b>${m0(B.tot.due)}</b></td><td class="r"><b>${B.tot.alloc?m0(B.tot.bal):'—'}</b></td><td class="r"><b>${pct(B.tot.util)}</b></td></tr></tbody></table>
  <p class="tiny" style="margin:4px 0 10px">Committed = PO amount, or the final bill where one is recorded. Cancelled POs are excluded.</p>
  ${mk.length?`<table style="font-size:12px"><thead><tr><th>Month</th><th>POs</th><th>Committed</th><th>Cumulative</th>${B.tot.alloc?'<th>Cumulative % of budget</th>':''}</tr></thead><tbody>${mk.map(k=>{cum+=B.months[k].com;return `<tr><td>${monthLabel(k)}</td><td class="c">${B.months[k].n}</td><td class="r">${m0(B.months[k].com)}</td><td class="r">${m0(cum)}</td>${B.tot.alloc?`<td class="r">${pct(cum/B.tot.alloc*100)}</td>`:''}</tr>`}).join('')}</tbody></table>`:''}
  ${B.top.length?`<p style="margin:12px 0 4px"><b>Largest work orders in the period</b></p><table style="font-size:12px"><thead><tr><th>PO</th><th>Date</th><th>Vendor</th><th>Work</th><th>Amount</th></tr></thead><tbody>${B.top.map(p=>`<tr><td>${esc(refOf(p))}</td><td>${dmy(p.date)}</td><td>${esc(p.vendor)}</td><td>${esc(p.desc)}</td><td class="r">${m0(poBase(p))}</td></tr>`).join('')}</tbody></table>`:''}
  ${B.bd.remarks?`<p style="margin:10px 0"><b>Remarks:</b> ${esc(B.bd.remarks).replace(/\n/g,'<br>')}</p>`:''}
  ${signBlock([['Prepared by',B.bd.preparedBy],['Recommended by',''],['Approved by',B.bd.approvedBy]])}`}
VIEWS.budget=()=>{
  const fy=cfg().fyStartMonth;const periods=budgetPeriods();if(!state.budgetYear||!periods.includes(state.budgetYear))state.budgetYear=periods.includes(periodOf({date:todayISO()},fy))?periodOf({date:todayISO()},fy):periods[0];
  const B=budgetData(state.budgetYear);const cats=cfg().categories;const all=cats.concat(B.rows.map(r=>r.cat).filter(k=>!cats.includes(k)));const byCat=Object.fromEntries(B.rows.map(r=>[r.cat,r]));
  const mx=Math.max(1,...B.rows.map(r=>Math.max(r.alloc,r.com)));
  state.after=recalcBudget;state.lock=true;
  return head('Budget statement for higher authority',`Committed spend by budget head against the approved budget · ${dmy(B.from)} to ${dmy(B.to)}`,
    `<select data-bind="bYear" aria-label="Budget period" style="width:auto">${opts(periods.map(p=>[p,periodName(p)]),state.budgetYear)}</select><button class="btn" data-act="budgetXlsx">Export Excel</button><button class="btn primary" data-act="budgetDownload">Print / Save PDF</button>`)+
  (B.tot.alloc?'':`<div class="note info">Enter the approved budget for each head below and press Save budget. The balance and utilisation columns fill in from those figures. No budget amounts are assumed.</div>`)+
  `<div class="kpis"><div class="kpi"><small>Approved budget</small><b id="kb">৳ ${m0(B.tot.alloc)}</b></div><div class="kpi"><small>Committed (${B.tot.n} POs)</small><b>৳ ${m0(B.tot.com)}</b></div><div class="kpi good"><small>Paid</small><b>৳ ${m0(B.tot.paid)}</b></div><div class="kpi ${B.tot.due?'bad':''}"><small>Outstanding</small><b>৳ ${m0(B.tot.due)}</b></div><div class="kpi"><small>Balance / used</small><b id="kbal">${B.tot.alloc?'৳ '+m0(B.tot.bal):'—'}</b><i id="kutil">${B.tot.alloc?pct(B.tot.util)+' used':''}</i></div></div>
  <div class="card"><div class="card-h"><h2>Budget by head</h2><button class="btn primary sm" data-act="saveBudget">Save budget</button></div>
   <div class="tw"><table class="t"><thead><tr><th>Budget head</th><th class="num">Approved budget (৳)</th><th class="num">POs</th><th class="num">Committed</th><th class="num">Paid</th><th class="num">Outstanding</th><th class="num">Balance</th><th class="num">Used</th></tr></thead>
   <tbody data-bind="bCalc">${all.map(k=>{const r=byCat[k]||{n:0,com:0,paid:0,due:0};return `<tr data-com="${r.com}"><td>${esc(k)}</td><td class="num"><input class="ba" type="number" step="any" min="0" data-k="${esc(k)}" value="${(B.bd.alloc||{})[k]||''}" style="width:130px;text-align:right" aria-label="Budget for ${esc(k)}"></td><td class="num">${r.n}</td><td class="num">${m0(r.com)}</td><td class="num">${m0(r.paid)}</td><td class="num">${m0(r.due)}</td><td class="num bb">—</td><td class="num bu">—</td></tr>`}).join('')}</tbody>
   <tfoot><tr><td>Total</td><td class="num" id="bta">0</td><td class="num">${B.tot.n}</td><td class="num">${m0(B.tot.com)}</td><td class="num">${m0(B.tot.paid)}</td><td class="num">${m0(B.tot.due)}</td><td class="num" id="btb">—</td><td class="num" id="btu">—</td></tr></tfoot></table></div>
   ${B.undated?`<p class="hint" style="margin-top:8px">${B.undated} POs have no date and are left out of every period. Fix them in Reports, Data quality.</p>`:''}
   <div class="frm" style="margin-top:14px"><div class="fld all"><label class="lbl" for="b-rem">Remarks for higher authority</label><textarea id="b-rem" rows="3" placeholder="Reasons for over-spend, urgent works, planned projects, requested additional budget…">${esc(B.bd.remarks||'')}</textarea></div>
   <div class="fld"><label class="lbl" for="b-by">Prepared by</label><input id="b-by" type="text" value="${esc(B.bd.preparedBy||'')}"></div><div class="fld"><label class="lbl" for="b-ap">Approved by</label><input id="b-ap" type="text" value="${esc(B.bd.approvedBy||'')}"></div></div></div>
  ${B.rows.length?`<div class="card"><div class="card-h"><h2>Budget against spend</h2><div class="leg"><span><i style="background:var(--ink2);opacity:.4"></i>Budget</span><span><i style="background:var(--bar)"></i>Committed</span></div></div><div class="hb">${B.rows.map(r=>`<span>${esc(r.cat)}</span><div class="track" style="height:16px"><div class="fill2" style="width:${r.alloc/mx*100}%;background:var(--ink2);opacity:.28"></div><div class="fill" style="width:${r.com/mx*100}%;position:relative;opacity:.9"></div></div><span class="num small">${compact(r.com)}${r.alloc?' / '+compact(r.alloc):''}</span>`).join('')}</div></div>`:''}
  <details class="box"><summary>Statement preview</summary><div><div class="paper-wrap"><div class="paper" id="bPreview">${docBudget(B)}</div></div></div></details>`};
function recalcBudget(){const rows=$$('tbody[data-bind=bCalc] tr');if(!rows.length)return;let a=0,c=0;rows.forEach(tr=>{const al=num($('.ba',tr).value),com=num(tr.dataset.com);a+=al;c+=com;$('.bb',tr).textContent=al?m0(al-com):'—';const u=$('.bu',tr);u.textContent=al?pct(com/al*100):'—';u.style.color=al&&com>al?'var(--bad)':'';});
  $('#bta').textContent=m0(a);$('#btb').textContent=a?m0(a-c):'—';$('#btu').textContent=a?pct(c/a*100):'—'}
BIND.bCalc=()=>recalcBudget();
BIND.bYear=el=>{state.budgetYear=el.value;render()};
function collectBudget(){const label=state.budgetYear;const all=clone(S.meta.budget||{periods:{}});all.periods=all.periods||{};const alloc={};$$('.ba').forEach(i=>{const v=num(i.value);if(v)alloc[i.dataset.k]=v});
  all.periods[label]={alloc,remarks:$('#b-rem').value.trim(),preparedBy:$('#b-by').value.trim(),approvedBy:$('#b-ap').value.trim()};return all}
ACT.saveBudget=()=>{put('meta','budget',collectBudget());toast('Budget saved for '+periodName(state.budgetYear));render()};
ACT.budgetDownload=()=>{put('meta','budget',collectBudget());const B=budgetData(state.budgetYear);printFile('Budget Statement '+periodName(B.label),docBudget(B),'Budget-Statement-'+B.label+'.html')};
ACT.budgetXlsx=()=>{const B=budgetData(state.budgetYear);
  exportXlsx('Budget_Statement_'+B.label+'.xlsx',[{name:'By head',head:['Budget head','Approved budget','POs','Committed','Paid','Outstanding','Balance','Used %'],rows:B.rows.map(r=>[r.cat,r.alloc||'',r.n,r.com,r.paid,r.due,r.alloc?r.bal:'',r.util==null?'':+r.util.toFixed(1)]).concat([['Total',B.tot.alloc||'',B.tot.n,B.tot.com,B.tot.paid,B.tot.due,B.tot.alloc?B.tot.bal:'',B.tot.util==null?'':+B.tot.util.toFixed(1)]])},
   {name:'By month',head:['Month','POs','Committed','Paid'],rows:Object.keys(B.months).sort().map(k=>[monthLabel(k),B.months[k].n,B.months[k].com,B.months[k].paid])},
   {name:'PO list',head:['PO','Date','Vendor','Work','Category','Committed','Paid','Due','Status'],rows:B.pos.slice().sort((a,b)=>a.no-b.no).map(p=>[refOf(p),dmy(p.date),p.vendor,p.desc,p.category,poBase(p),poPaid(p),poDue(p),p.status])}])};

/* ========== Reports ========== */
function rpos(){const f=state.rf;return poList().filter(p=>{if(f.cat&&p.category!==f.cat)return false;if(f.campus&&campusKey(p.location)!==f.campus)return false;if(f.from&&(!p.date||p.date<f.from))return false;if(f.to&&(!p.date||p.date>f.to))return false;return true})}
const live=l=>l.filter(p=>p.status!=='Cancelled');
function groupRep(keyFn,label){const l=live(rpos());const g={};l.forEach(p=>{const k=keyFn(p)||'—';const x=g[k]=g[k]||{n:0,c:0,p:0,d:0,last:''};x.n++;x.c+=poBase(p);x.p+=poPaid(p);x.d+=poDue(p);if(p.date>x.last)x.last=p.date});
  const tot=sum(Object.values(g),x=>x.c);const keys=Object.keys(g).sort((a,b)=>g[b].c-g[a].c);
  return{head:[label,'POs','Committed','Paid','Outstanding','Share %','Last PO date'],kinds:['t','i','n','n','n','p','d'],rows:keys.map(k=>[k,g[k].n,g[k].c,g[k].p,g[k].d,tot?g[k].c/tot*100:0,g[k].last]),sums:[1,2,3,4]}}
const REPORTS={
 register:{t:'PO register',build:()=>{const l=rpos();return{head:['PO Ref','Date','Vendor','Work description','Location','Category','PO Amount','Final Bill','Paid','Due','Status','CS','WCC'],kinds:['t','d','t','t','t','t','n','n','n','n','t','t','t'],
   rows:l.map(p=>[refOf(p),p.date,p.vendor,p.desc,p.location,p.category||'',num(p.amount),p.finalBill?num(p.finalBill):'',poPaid(p),poDue(p),p.status,p.csRef||'',(p.wccRefs||[]).join(', ')]),links:l.map(p=>'po-'+p.no),sums:[6,7,8,9]}}},
 vendor:{t:'Vendor-wise summary',build:()=>groupRep(p=>p.vendor,'Vendor')},
 campus:{t:'Campus-wise summary',build:()=>groupRep(p=>campusKey(p.location),'Campus')},
 category:{t:'Budget head-wise summary',build:()=>groupRep(p=>p.category||'Others','Budget head')},
 month:{t:'Month-wise summary',build:()=>{const r=groupRep(p=>p.date?monthKey(p.date):'Undated','Month');r.rows.sort((a,b)=>b[0].localeCompare(a[0]));r.rows.forEach(x=>{if(x[0]!=='Undated')x[0]=monthLabel(x[0])});return r}},
 dues:{t:'Outstanding dues (ageing)',build:()=>{const t=todayISO();const l=live(rpos()).filter(p=>poDue(p)>0).map(p=>({p,age:p.date?daysBetween(p.date,t):null})).sort((a,b)=>(b.age||0)-(a.age||0));
   const bucket=a=>a==null?'No date':a<=30?'0–30':a<=60?'31–60':a<=90?'61–90':'90+';
   return{head:['PO Ref','Date','Vendor','Work description','Status','Bill value','Paid','Due','Age (days)','Bucket'],kinds:['t','d','t','t','t','n','n','n','i','t'],rows:l.map(x=>[refOf(x.p),x.p.date,x.p.vendor,x.p.desc,x.p.status,poBase(x.p),poPaid(x.p),poDue(x.p),x.age==null?'':x.age,bucket(x.age)]),links:l.map(x=>'po-'+x.p.no),sums:[5,6,7]}}},
 bills:{t:'Bills submitted, payment pending',build:()=>{const l=live(rpos()).filter(p=>p.status==='Bill Submitted'||(p.billUpdate&&/submit/i.test(p.billUpdate)&&poDue(p)>0));return{head:['PO Ref','Vendor','Work description','Bill update','Bill value','Paid','Due','CQ number'],kinds:['t','t','t','t','n','n','n','t'],rows:l.map(p=>[refOf(p),p.vendor,p.desc,p.billUpdate||'',poBase(p),poPaid(p),poDue(p),p.chequeNo||'']),links:l.map(p=>'po-'+p.no),sums:[4,5,6]}}},
 nowcc:{t:'Open POs without a WCC',build:()=>{const l=live(rpos()).filter(p=>isOpen(p)&&!(p.wccRefs||[]).length);return{head:['PO Ref','Date','Vendor','Work description','Amount','Status','Age (days)'],kinds:['t','d','t','t','n','t','i'],rows:l.map(p=>[refOf(p),p.date,p.vendor,p.desc,poBase(p),p.status,p.date?daysBetween(p.date,todayISO()):'']),links:l.map(p=>'po-'+p.no),sums:[4]}}},
 cs:{t:'Comparative statements and savings',build:()=>{const l=Object.values(S.cs).sort((a,b)=>b.no-a.no);return{head:['CS Ref','Date','Work','Vendors','Lowest quote','Recommended vendor','Recommended amount','Saving vs highest','Status','PO'],kinds:['t','d','t','i','n','t','n','n','t','t'],
   rows:l.map(cs=>{const t=csTotals(cs),lo=csLowest(t),rec=cs.rec||0;return[cs.ref,cs.date,cs.title,cs.vendors.length,lo>=0?t[lo]:'',(cs.vendors[rec]||{}).name||'',t[rec],Math.max(...t)-t[rec],cs.status,cs.poRef||'']}),links:l.map(cs=>'cs-'+cs.no),sums:[6,7]}}},
 wcc:{t:'Work completion certificates',build:()=>{const l=Object.values(S.wcc).sort((a,b)=>b.no-a.no);return{head:['WCC Ref','Date','PO Ref','Vendor','Work','Gross','Deduction','Net certified','Delay (days)','Status'],kinds:['t','d','t','t','t','n','n','n','i','t'],
   rows:l.map(w=>{const p=wccPO(w)||{};const due=p.date&&p.terms&&p.terms.days?addDays(p.date,num(p.terms.days)):'';const late=due&&w.completionDate?Math.max(0,daysBetween(due,w.completionDate)):'';return[w.ref,w.date,w.poRef,w.vendor,w.desc,w.gross,num(w.deduction),w.net,late,w.status]}),links:l.map(w=>'wcc-'+w.no),sums:[5,6,7]}}},
 quality:{t:'Data quality check',build:()=>{const out=[];const t=todayISO();
   poList().forEach(p=>{const add=(i,d)=>out.push([refOf(p),i,d,p.vendor,p.no]);
    if(!p.date)add('Missing date','Add the PO date so it appears in budget periods and monthly reports.');
    if(p.dateFlag)add('Date auto-corrected',p.dateFlag+' (now '+dmy(p.date)+'). Confirm the real date.');
    if(p.items&&p.items.length&&Math.abs(r2(sum(p.items,i=>i.qty*i.rate))-num(p.amount))>0.5)add('PO amount differs from items','Items total '+money(sum(p.items,i=>i.qty*i.rate))+' vs PO amount '+money(p.amount));
    if(p.status!=='Cancelled'&&poRec(p)>poBase(p)+0.5)add('Paid more than bill value','Recorded payments '+money(poRec(p))+' vs bill '+money(poBase(p)));
    if(p.status==='Paid'&&!poRec(p))add('Marked Paid but no payment recorded','Add the payment entry so the due amount is correct.');
    if(p.status==='Paid'&&poRec(p)&&poBase(p)-poRec(p)>0.5)add('Marked Paid but recorded payments are below the bill','Recorded '+money(poRec(p))+' vs bill '+money(poBase(p)));
    if(isOpen(p)&&p.date&&daysBetween(p.date,t)>90&&!poRec(p))add('Open for over 90 days, no payment','Update the status or record the payment.');
    if(p.status!=='Cancelled'&&!p.category)add('No budget head','Select a category.')});
   return{head:['PO Ref','Issue','Detail','Vendor'],kinds:['t','t','t','t'],rows:out.map(x=>x.slice(0,4)),links:out.map(x=>'po-'+x[4]),sums:[]}}}
};
function fmtCell(v,k){if(v===''||v==null)return '';if(k==='d')return dmy(v);if(k==='n')return m0(v);if(k==='i')return String(v);if(k==='p')return num(v).toFixed(1)+'%';return esc(v)}
function drawReport(){const R=REPORTS[state.report]||REPORTS.register;const d=R.build();state.rep=d;
  const tot=d.sums.map(i=>sum(d.rows,r=>num(r[i])));
  $('#repBody').innerHTML=d.rows.length?`<div class="tw" style="max-height:68vh"><table class="t"><thead><tr>${d.head.map((h,i)=>`<th class="${'nip'.includes(d.kinds[i])?'num':''}">${esc(h)}</th>`).join('')}</tr></thead><tbody>
   ${d.rows.slice(0,800).map((r,k)=>`<tr ${d.links?`class="click" data-go="${d.links[k]}"`:''}>${r.map((v,i)=>`<td class="${'nip'.includes(d.kinds[i])?'num':''}${i===0&&d.links?' mono':''}${['Work description','Work','Detail'].includes(d.head[i])?' wide':''}">${fmtCell(v,d.kinds[i])}</td>`).join('')}</tr>`).join('')}</tbody>
   ${d.sums.length?`<tfoot><tr>${d.head.map((h,i)=>`<td class="${'nip'.includes(d.kinds[i])?'num':''}">${i===0?d.rows.length+' rows':d.sums.includes(i)?m0(tot[d.sums.indexOf(i)]):''}</td>`).join('')}</tr></tfoot>`:''}</table></div>`:`<div class="card empty"><b>${state.report==='quality'?'No data issues found':'Nothing to show'}</b>${state.report==='quality'?'Dates, amounts and statuses are consistent.':'No records match this report and filter.'}</div>`}
VIEWS.reports=()=>{const all=poList();const f=state.rf;
  state.after=drawReport;
  return head('Reports','Report database over every PO, CS and WCC. Filter, then export to Excel.','<button class="btn primary" data-act="repXlsx">Export Excel</button>')+
  `<div class="card"><div class="tabs" role="tablist">${Object.entries(REPORTS).map(([k,r])=>`<button role="tab" class="${k===state.report?'on':''}" data-act="repTab" data-k="${k}">${r.t}</button>`).join('')}</div>
   <div class="filters" style="margin-top:12px"><div class="f"><label for="rf-from">From</label><input id="rf-from" type="date" data-bind="rf" data-k="from" value="${f.from}"></div><div class="f"><label for="rf-to">To</label><input id="rf-to" type="date" data-bind="rf" data-k="to" value="${f.to}"></div>
   <div class="f"><label for="rf-cat">Category</label><select id="rf-cat" data-bind="rf" data-k="cat">${opts(cfg().categories,f.cat,'All')}</select></div>
   <div class="f"><label for="rf-campus">Campus</label><select id="rf-campus" data-bind="rf" data-k="campus">${opts([...new Set(all.map(p=>campusKey(p.location)))].sort(),f.campus,'All')}</select></div>
   <button class="btn ghost" data-act="repClear">Clear</button></div></div><div id="repBody"></div>`};
BIND.rf=el=>{state.rf[el.dataset.k]=el.value;drawReport()};
ACT.repClear=()=>{state.rf={from:'',to:'',cat:'',campus:''};render()};
ACT.repTab=el=>{state.report=el.dataset.k;render()};
ACT.repXlsx=()=>{const R=REPORTS[state.report];const d=R.build();exportXlsx('Report_'+slug(R.t)+'_'+todayISO()+'.xlsx',[{name:R.t,head:d.head,rows:d.rows.map(r=>r.map((v,i)=>d.kinds[i]==='d'?(v?dmy(v):''):d.kinds[i]==='p'?(v===''?'':+num(v).toFixed(1)):v))}])};
ACT.openDQ=()=>{state.report='quality';go('reports')};

/* ========== Vendors ========== */
VIEWS.vendors=()=>{const vs=vendorList();const live=poList().filter(p=>p.status!=='Cancelled');
  return head('Vendors','Vendor master. Vendors are added automatically when you issue a PO.')+
  (vs.length?`<div class="tw"><table class="t"><thead><tr><th>Vendor</th><th>Address</th><th>Phone</th><th>Service</th><th class="num">POs</th><th class="num">Committed</th><th class="num">Due</th><th></th></tr></thead><tbody>
  ${vs.map(v=>{const l=live.filter(p=>slug(p.vendor||'')===slug(v.name));return `<tr><td class="mid"><b>${esc(v.name)}</b></td><td class="wide">${esc(v.address)}</td><td>${esc(v.phone||'')}</td><td>${esc(v.trade||'')}</td><td class="num">${l.length}</td><td class="num">${m0(sum(l,poBase))}</td><td class="num">${sum(l,poDue)?m0(sum(l,poDue)):'—'}</td><td><button class="btn sm" data-act="editVendor" data-k="${esc(slug(v.name))}">Edit</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="card empty"><b>No vendors yet</b>They appear when you create a PO.</div>')};
ACT.editVendor=el=>{const v=vendorList().find(x=>slug(x.name)===el.dataset.k);if(!v)return;
  modal(`<h2>${esc(v.name)}</h2><div class="frm" style="grid-template-columns:1fr"><div class="fld"><label class="lbl" for="v-addr">Address</label><input id="v-addr" type="text" value="${esc(v.address)}"></div><div class="fld"><label class="lbl" for="v-ph">Phone</label><input id="v-ph" type="text" value="${esc(v.phone||'')}"></div><div class="fld"><label class="lbl" for="v-tr">Service / trade</label><input id="v-tr" type="text" value="${esc(v.trade||'')}" placeholder="e.g. AC service, painting, furniture"></div></div>
  <div class="actions" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" id="v-ok">Save</button></div>`);
  $('#v-ok').onclick=()=>{put('vendors',slug(v.name),{name:v.name,address:$('#v-addr').value.trim(),phone:$('#v-ph').value.trim(),trade:$('#v-tr').value.trim()});closeModal();toast('Vendor saved');render()}};

/* ========== Settings ========== */
VIEWS.settings=()=>{const c=cfg();state.lock=true;const L=a=>esc((a||[]).join('\n'));const mx=Object.values(S.pos).reduce((m,p)=>Math.max(m,p.no||0),0);
  return head('Settings','Numbering, lists and default terms used on new documents.','<button class="btn primary" data-act="saveSettings">Save settings</button>')+
  `<div class="card"><h2>Organisation and numbering</h2><div class="frm">
   <div class="fld span2"><label class="lbl" for="s-org">Organisation name on documents</label><input id="s-org" type="text" value="${esc(c.org)}"></div>
   <div class="fld"><label class="lbl" for="s-sub">Sub-title</label><input id="s-sub" type="text" value="${esc(c.orgSub)}"></div>
   <div class="fld all"><label class="lbl" for="s-addr">Address under the header</label><input id="s-addr" type="text" value="${esc(c.orgAddr)}"></div>
   <div class="fld"><label class="lbl" for="s-ppo">PO prefix</label><input id="s-ppo" type="text" value="${esc(c.poPrefix)}"></div>
   <div class="fld"><label class="lbl" for="s-npo">Next PO number</label><input id="s-npo" type="number" value="${nextPoNo()}" min="${mx+1}"><span class="hint">Highest used is ${mx||'none'}. It cannot go lower than the next number.</span></div>
   <div class="fld"><label class="lbl" for="s-pcs">CS prefix</label><input id="s-pcs" type="text" value="${esc(c.csPrefix)}"></div>
   <div class="fld"><label class="lbl" for="s-pwc">WCC prefix</label><input id="s-pwc" type="text" value="${esc(c.wccPrefix)}"></div>
   <div class="fld"><label class="lbl" for="s-fy">Budget year starts in</label><select id="s-fy">${opts(MN.map((m,i)=>[i+1,m]),c.fyStartMonth)}</select><span class="hint">January means a calendar-year budget. Change it if the school budget runs July to June.</span></div></div></div>
  <div class="card"><h2>Lists (one per line)</h2><div class="frm">
   <div class="fld"><label class="lbl" for="s-cam">Campuses</label><textarea id="s-cam" rows="6">${L(c.campuses)}</textarea></div>
   <div class="fld"><label class="lbl" for="s-cat">Budget heads / categories</label><textarea id="s-cat" rows="6">${L(c.categories)}</textarea></div>
   <div class="fld"><label class="lbl" for="s-uom">Units of measure</label><textarea id="s-uom" rows="6">${L(c.uoms)}</textarea></div></div></div>
  <div class="card"><h2>Default PO terms</h2><div class="frm">
   <div class="fld"><label class="lbl" for="s-days">Completion days</label><input id="s-days" type="number" value="${esc(c.terms.days)}"></div>
   <div class="fld"><label class="lbl" for="s-adv">Advance %</label><input id="s-adv" type="number" value="${esc(c.terms.advancePct)}"></div>
   <div class="fld"><label class="lbl" for="s-cr">Payment credit</label><input id="s-cr" type="text" value="${esc(c.terms.credit)}"></div>
   <div class="fld"><label class="lbl" for="s-me">Payment method</label><input id="s-me" type="text" value="${esc(c.terms.method)}"></div>
   <div class="fld"><label class="lbl" for="s-tx">VAT / AIT note</label><input id="s-tx" type="text" value="${esc(c.terms.tax)}"></div>
   <div class="fld all"><label class="lbl" for="s-gen">General conditions</label><textarea id="s-gen" rows="4">${L(c.terms.general)}</textarea></div>
   <div class="fld all"><label class="lbl" for="s-cc">CC distribution</label><textarea id="s-cc" rows="3">${L(c.cc)}</textarea></div>
   <div class="fld all"><label class="lbl" for="s-chk">WCC quality checklist</label><textarea id="s-chk" rows="5">${L(c.wccChecklist)}</textarea></div></div></div>
  <div class="card"><h2>Data</h2><p class="muted">Backup keeps every PO, CS, WCC, vendor and budget in one file.</p><div class="actions">
   <button class="btn" data-act="backup">Download backup (JSON)</button><label class="btn" for="restoreFile" style="cursor:pointer">Restore from backup…</label><input id="restoreFile" type="file" accept=".json,application/json" data-bind="restoreFile" hidden>
   ${Object.keys(S.pos).length?'':'<button class="btn primary" data-act="loadSeed">Load my existing tracker</button>'}</div></div>`};
ACT.saveSettings=()=>{const g=id=>$('#'+id).value.trim(),L=id=>$('#'+id).value.split('\n').map(s=>s.trim()).filter(Boolean);
  const mx=Object.values(S.pos).reduce((m,p)=>Math.max(m,p.no||0),0);const npo=Math.max(num(g('s-npo')),mx+1);
  saveSettings({org:g('s-org')||DEF.org,orgSub:g('s-sub'),orgAddr:g('s-addr')||DEF.orgAddr,poPrefix:g('s-ppo')||DEF.poPrefix,csPrefix:g('s-pcs')||DEF.csPrefix,wccPrefix:g('s-pwc')||DEF.wccPrefix,nextPO:npo,fyStartMonth:+g('s-fy')||1,
    campuses:L('s-cam'),categories:L('s-cat'),uoms:L('s-uom'),cc:L('s-cc'),wccChecklist:L('s-chk'),
    terms:{days:num(g('s-days'))||10,advancePct:num(g('s-adv')),credit:g('s-cr'),method:g('s-me'),tax:g('s-tx'),general:L('s-gen')}});
  toast('Settings saved');render()};
ACT.backup=()=>download('AHIS-ERP-backup-'+todayISO()+'.json',JSON.stringify(S));
BIND.restoreFile=el=>{const f=el.files[0];if(!f)return;if(f.size>8e6){toast('File is too large','bad');return}
  const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);const n=COLS.reduce((a,c)=>a+Object.keys(o[c]||{}).length,0);if(!n)throw 0;
    confirmBox('Restore <b>'+n+'</b> records from this backup? Records with the same id are overwritten.','Restore',()=>{COLS.forEach(c=>Object.entries(o[c]||{}).forEach(([id,v])=>put(c,id,v)));toast('Backup restored');render()})}catch(e){toast('This is not a valid backup file','bad')}};rd.readAsText(f)};

/* ========== boot ========== */

document.getElementById('railLogo').src=LOGO;
(async function boot(){
  const cl=window.claude;let db=null;
  try{db=cl&&cl.use?await cl.use('db'):null}catch(e){db=null}
  if(!db){localLoad();mode='local';loaded=true;render();return}
  DB=db;mode='shared';const got={};let fin=false;
  const done=()=>{if(fin)return;fin=true;loaded=true;render()};
  COLS.forEach(c=>{try{DB.collection(c).onSnapshot(sn=>{applySnap(c,sn);got[c]=true;if(COLS.every(k=>got[k]))done()},err=>{console.warn(err);got[c]=true;if(COLS.every(k=>got[k]))done()})}catch(e){got[c]=true}});
  setTimeout(done,10000);render();
})();
</script>

</body></html>
